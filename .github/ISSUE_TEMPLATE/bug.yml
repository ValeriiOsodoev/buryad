name: Ошибка на сайте
description: Сообщить о технической проблеме
title: "[Ошибка] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте пароли, токены и другие личные данные. Сначала проверьте похожие открытые Issues.
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести?
      placeholder: "1. Открыть…\n2. Нажать…\n3. Увидеть…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Устройство / браузер
      placeholder: iPhone Safari, Chrome macOS…
