name: Generate immersion visuals

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many manifest assets to generate (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tools.txt
      - name: Generate GPT Image assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_immersion_images.py --limit "${{ inputs.limit }}"
      - name: Build responsive image derivatives
        run: python scripts/optimize_immersion_images.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/images
          git diff --cached --quiet || git commit -m "assets: generate immersion visuals"
          git push
