name: Generate immersion visuals

on:
  push:
    paths:
      - ".github/image-generation.json"
  workflow_dispatch:
    inputs:
      asset_ids:
        description: "Comma-separated manifest asset IDs; empty means all"
        required: false
        default: ""
      force:
        description: "Regenerate assets that already exist"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tools.txt

      - name: Require OpenAI image key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: : "${OPENAI_API_KEY:?Add repository secret OPENAI_API_KEY}"

      - name: Generate configured batch
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_immersion_images.py --config .github/image-generation.json

      - name: Generate manually selected assets
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASSET_IDS: ${{ inputs.asset_ids }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ -n "$ASSET_IDS" ]]; then
            args+=(--ids "$ASSET_IDS")
          fi
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python scripts/generate_immersion_images.py "${args[@]}"

      - name: Build responsive image derivatives
        run: python scripts/optimize_immersion_images.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/images
          git diff --cached --quiet || git commit -m "assets: generate immersion visuals"
          git push
