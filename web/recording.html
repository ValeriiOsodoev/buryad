<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BURYAД — запись носителя</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><main class="recording-studio"><header><span class="eyebrow">BURYAД · native recording</span><h1>Запись живого голоса</h1><p>Читайте фразу естественно. Записывайте два варианта: медленно и обычным бытовым темпом.</p></header><section class="recording-card"><div class="recording-meta"><span id="recordingCounter">1 / 1</span><select id="recordingVariant"><option value="slow">Медленно</option><option value="natural">Естественно</option></select></div><h2 id="recordingText">Загрузка…</h2><div class="recording-fields"><input id="recordingSpeaker" placeholder="Имя / код говорящего"><input id="recordingDialect" placeholder="Регион / диалект"></div><div class="recording-actions"><button class="secondary" id="recordingPrev">←</button><button class="primary" id="recordingStart">● Записать</button><button class="secondary" id="recordingStop" disabled>■ Стоп</button><button class="secondary" id="recordingPlay" disabled>▶ Прослушать</button><a class="secondary hidden" id="recordingDownload" download>Скачать файл</a><button class="secondary" id="recordingNext">→</button></div><audio id="recordingAudio"></audio><p id="recordingStatus"></p></section></main><script type="module" src="/assets/js/recording-studio.js"></script></body></html>
